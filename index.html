*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font:15px/1.5 'Inter Tight',system-ui,sans-serif;color:#0d1740;background:linear-gradient(150deg,#ece8ff 0%,#fbdff0 55%,#fde9d2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow-x:hidden}
.bl{position:fixed;border-radius:50%;pointer-events:none}
.card{position:relative;z-index:1;width:100%;max-width:400px;background:#fff;border:2px solid #e0dcf5;border-radius:28px;padding:34px 30px 26px;box-shadow:0 20px 50px rgba(60,40,140,.12)}
.logo{display:block;width:210px;margin:0 auto 18px}
h1{font:700 22px Poppins,sans-serif;text-align:center;margin:0 0 4px;letter-spacing:-.01em}
.sub{text-align:center;color:#6a7090;font-size:14px;margin:0 0 22px}
label{display:block;font-weight:600;font-size:13px;margin-bottom:14px}
input{display:block;width:100%;margin-top:6px;border:1.5px solid #e0dcf5;border-radius:12px;padding:12px 14px;font:inherit;color:inherit;outline:none;background:#fff}
input:focus{border-color:#e8740c;box-shadow:0 0 0 3px rgba(232,116,12,.15)}
.pw{position:relative}.pw button{position:absolute;right:8px;top:12px;border:0;background:none;color:#6a7090;font:600 12px inherit;cursor:pointer;padding:6px 8px}
.go{width:100%;border:0;border-radius:14px;background:#e8740c;color:#fff;font:700 15px Poppins,sans-serif;padding:14px;cursor:pointer;margin-top:4px}
.go:disabled{opacity:.6;cursor:default}
.err{background:#ffe9e9;color:#a52a2f;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:0 0 14px;display:none}
.help{text-align:center;color:#6a7090;font-size:12.5px;margin:16px 0 0}
.cr{text-align:center;color:#a2a7c2;font-size:11.5px;margin-top:20px}
.load{text-align:center;padding:30px 0 20px}.load p{color:#6a7090;margin:14px 0 0}
.dot{width:34px;height:34px;border-radius:50%;border:4px solid #e0dcf5;border-top-color:#e8740c;margin:0 auto;animation:r 0.9s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}

function conf(){return !/COLE_AQUI/.test(SUPABASE_URL+SUPABASE_ANON_KEY)}
function auth(path,body){return fetch(SUPABASE_URL+'/auth/v1/'+path,{method:'POST',headers:{'apikey':SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok){var e=new Error(j.msg||j.message||'erro');e.code=j.error_code||j.error||'';e.status=r.status;throw e}return j})})}
function pack(j){return{at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000-60000,uid:j.user.id,email:j.user.email}}
function valid(){var s=load();if(!s)return Promise.resolve(null);if(Date.now()<s.exp)return Promise.resolve(s);
 return auth('token?grant_type=refresh_token',{refresh_token:s.rt}).then(function(j){var n=pack(j);store(n);return n}).catch(function(e){if(e.status&&e.status<500){clear();return null}throw e})}
function msgErro(e){var c=e.code||'';
 if(c==='invalid_credentials'||e.status===400&&!c)return 'E-mail ou senha incorretos.';
 if(c==='user_banned')return 'O seu acesso está suspenso. Fale com a Helen.';
 if(c==='email_not_confirmed')return 'Seu e-mail ainda não foi confirmado. Fale com a Helen.';
 if(e.status===429||/rate/.test(c))return 'Muitas tentativas. Espere um minuto e tente de novo.';
 if(!e.status)return 'Sem conexão com a internet. Tente de novo.';
 return 'Não foi possível entrar agora. Tente de novo em instantes.'}
function abrir(s){show('load');
 fetch(SUPABASE_URL+'/storage/v1/object/authenticated/'+BUCKET+'/'+ARQUIVO,{cache:'no-store',headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+s.at}})
 .then(function(r){if(r.status===401||r.status===403||r.status===400&&false){clear();show('form','Sua sessão expirou ou o acesso foi suspenso. Entre de novo ou fale com a Helen.');return null}
  if(!r.ok){show('form','O aplicativo não foi encontrado no servidor. Avise a Helen.');return null}return r.text()})
 .then(function(html){if(!html)return;
  window.SHM={uid:s.uid,email:s.email,logout:function(){clear();location.reload()}};
  document.open();document.write(html);document.close()})
 .catch(function(){show('form','Sem conexão com a internet. Tente de novo.')})}
$('eye').onclick=function(){var p=$('pw');var v=p.type==='password';p.type=v?'text':'password';this.textContent=v?'ocultar':'mostrar'};
$('f').onsubmit=function(ev){ev.preventDefault();if(!conf()){show('form','Login ainda não configurado.');return}
 var b=$('go');b.disabled=true;b.textContent='Entrando...';
 auth('token?grant_type=password',{email:$('em').value.trim(),password:$('pw').value}).then(function(j){var s=pack(j);store(s);abrir(s)})
 .catch(function(e){show('form',msgErro(e))}).then(function(){b.disabled=false;b.textContent='Entrar'})};
if(!conf()){show('form','Login ainda não configurado: faltam a URL e a chave do Supabase no arquivo index.html.')}
else valid().then(function(s){if(s)abrir(s);else show('form')}).catch(function(){show('form','Sem conexão com a internet. Tente de novo.')});
})();
</script></body></html>
